name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: verify
        run: |
          node --version
          node --test test/
      - name: tree-digest
        run: |
          echo "head=$(git rev-parse HEAD)"
          find . -path ./.git -prune -o -type f -print | sort | xargs sha256sum | sha256sum
